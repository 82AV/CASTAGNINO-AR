<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidad Aumentada - Museo Castagnino</title>
  <!-- Cargamos la librería oficial de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; background-color: #000; }
  </style>
</head>
<body>

  <!-- Reemplaza mi-modelo.glb por el nombre exacto de tu archivo 3D -->
  <model-viewer 
    src="DD AR.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1"
    autoplay>
    <button slot="ar-button" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px;">
      Ver en Realidad Aumentada
    </button>
  </model-viewer>

</body>
</html>
